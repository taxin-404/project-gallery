<a class="card" [href]="project().url">
  <div class="preview">
    <iframe
      [src]="previewUrl()"
      [title]="'Preview of ' + project().title"
      sandbox="allow-scripts allow-forms allow-popups allow-modals"
      loading="lazy"
      tabindex="-1"
      scrolling="no"
    ></iframe>

    <span class="open-pill" aria-hidden="true">
      Open project
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </span>
  </div>

  <div class="card-body">
    <div class="card-top">
      <span
        class="chip"
        [class.HTML]="project().category === 'HTML'"
        [class.CSS]="project().category === 'CSS'"
        [class.custom]="isCustomCategory()"
        [style.--hue]="hue()"
      >
        <app-category-icon [category]="project().category" [size]="12" />
        {{ project().category }}
      </span>
      <span class="num">#{{ project().order }}</span>
      <svg
        class="arrow"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17 17 7" />
        <path d="M8 7h9v9" />
      </svg>
    </div>

    <h2 class="title">{{ project().title }}</h2>
    <p class="folder">
      {{ project().folder }}
      @if (showRepo()) {
        <span class="repo">· {{ project().repo }}</span>
      }
    </p>
  </div>
</a>
